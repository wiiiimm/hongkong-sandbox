name: Sync data assets to R2

# Mirrors 3d-viewer/data/** into an S3-compatible bucket (Cloudflare R2) so the
# heavy JSON can be served from a separate origin instead of the app host. The
# app only fetches from that origin when ASSET_BASE is set (hostname-gated on the
# official deploy); forks keep serving /data/ from their own origin.
#
# Uses the bucket's S3 API via `aws s3 sync` for incremental, delete-aware
# uploads (only changed files move). Entirely opt-in: the job is skipped unless
# the destination bucket variable is set, so forks no-op. Configure in repo
# Settings → Secrets and variables → Actions:
#   Secrets (masked in the public run logs):
#     R2_ACCESS_KEY_ID       — S3 access key for the bucket
#     R2_SECRET_ACCESS_KEY   — its secret half
#     R2_ACCOUNT_ID          — account id for the S3 endpoint host
#   Variables:
#     R2_BUCKET              — destination bucket name

on:
  push:
    branches: [main]
    paths:
      - '3d-viewer/data/**'
      - '.github/workflows/sync-r2-assets.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Sync viewer data or recover the approved 17 exact Cheung originals
        type: choice
        required: true
        default: sync
        options: [sync, recover-originals]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'recover-originals' && 'r2-original-recovery' || 'r2-sync' }}
  cancel-in-progress: false

jobs:
  sync:
    # opt-in: only runs where the destination bucket variable is configured
    # (vars — unlike secrets — are available in job-level if conditions)
    if: ${{ vars.R2_BUCKET != '' && (github.event_name != 'workflow_dispatch' || inputs.operation != 'recover-originals') }}
    runs-on: ubuntu-latest
    steps:
      # sparse checkout: only the data payload, not the rest of the repo
      - uses: actions/checkout@v4
        with:
          sparse-checkout: 3d-viewer/data
          sparse-checkout-cone-mode: false

      # `data/…` keys so the bucket's custom domain serves <origin>/data/<file>,
      # matching ASSET_BASE + asset('data/<file>') in main.js. --delete keeps the
      # bucket a faithful mirror; --size-only avoids re-uploading on clone mtime churn.
      - name: Sync 3d-viewer/data → bucket /data
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          aws s3 sync 3d-viewer/data "s3://${BUCKET}/data" \
            --endpoint-url "https://${ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --delete \
            --size-only \
            --no-progress \
            --content-type "application/json" \
            --cache-control "public, max-age=3600"

  recover-originals:
    # Explicitly approved bounded read-only recovery; never runs the sync job.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'recover-originals' && github.ref == 'refs/heads/feature/islands-model-enhancement-and-compression' && vars.R2_BUCKET == 'hk-sandbox-assets' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source-scripts/city/government-import/recover_r2_originals.py
            docs/astra-city/government-import/government-islands-cheung-r2-recovery-20261107-v1/plan.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned read-only recovery client
        run: python -m pip install --disable-pip-version-check boto3==1.34.46
      - name: Recover only the approved exact original files
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          python source-scripts/city/government-import/recover_r2_originals.py \
            --plan docs/astra-city/government-import/government-islands-cheung-r2-recovery-20261107-v1/plan.json \
            --plan-sha256 7038555e77c0c43f8402d4260548e435ca1922272bea30655ae9a21f85d201ca \
            --output "$RUNNER_TEMP/recovered-originals"
      - name: Export only verified originals and the recovery report
        uses: actions/upload-artifact@v4
        with:
          name: cheung-chau-exact-originals-${{ github.run_id }}
          path: ${{ runner.temp }}/recovered-originals/
          if-no-files-found: error
          retention-days: 7
